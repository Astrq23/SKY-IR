name: CI

on:
  pull_request:
    branches: [main, dev, release]
  push:
    branches: [main, dev, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # tracker tests need no GPU / torch: install only what skyir.tracker imports
      - name: Install dependencies
        run: pip install numpy scipy lap opencv-python-headless pytest
      - name: Byte-compile all backend modules
        run: python -m compileall -q backend
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
